# PostgreSQL + a mock OIDC provider for exercising the auth system locally
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inundated
      POSTGRES_PASSWORD: inundated
      POSTGRES_DB: inundated
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inundated -d inundated"]
      interval: 2s
      timeout: 3s
      retries: 15
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.11
    environment:
      JSON_CONFIG: '{"interactiveLogin":true}'
    ports:
      - "9090:8080"
volumes:
  postgres-data:
