taskIdPath:
  name: taskId
  in: path
  required: true
  schema:
    type: string
    format: uuid

includeClosed:
  name: includeClosed
  in: query
  required: false
  description: >
    Whether to include closed tasks in the results. Defaults to false.
  schema:
    type: boolean
    default: false

parentId:
  name: parentId
  in: query
  required: false
  description: Only list direct subtasks of this task.
  schema:
    type: string
    format: uuid

ancestorId:
  name: ancestorId
  in: query
  required: false
  description: Only list subtasks of this task, at any depth.
  schema:
    type: string
    format: uuid

tagIdFilter:
  name: tagId
  in: query
  required: false
  description: Only list tasks carrying this regular tag.
  schema:
    type: string
    format: uuid

dueFrom:
  name: dueFrom
  in: query
  required: false
  description: Only list tasks due on or after this day.
  schema:
    type: string
    format: date

dueTo:
  name: dueTo
  in: query
  required: false
  description: Only list tasks due on or before this day.
  schema:
    type: string
    format: date

projectIdFilter:
  name: projectId
  in: query
  required: false
  description: >
    Only list tasks that belong to this project: tasks assigned to it, their
    subtasks, and tasks sharing one of its regular tags.
  schema:
    type: string
    format: uuid

taskInclude:
  name: include
  in: query
  description: >
    Comma-separated list of optional computed fields to include.
    Supported values: totalTimeMs, projectIds
  required: false
  style: form
  explode: false
  schema:
    type: array
    items:
      type: string
      enum:
        - totalTimeMs
        - projectIds
    uniqueItems: true
