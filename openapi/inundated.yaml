# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2025-09-15

openapi: 3.1.2
info:
  title: Inundated
  version: 0.0.1

servers:
  - url: /api

tags:
  - name: tags
  - name: projects
  - name: timespans

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK

  /tags:
    get:
      tags: [tags]
      summary: List tags
      operationId: listTags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      tags: [tags]
      summary: Create tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTag'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Bad request

  /tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [tags]
      summary: Get tag
      operationId: getTag
      responses:
        '200':
          description: Tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          description: Not found

    patch:
      tags: [tags]
      summary: Update tag
      operationId: updateTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTag'
      responses:
        '200':
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Bad request
        '404':
          description: Not found

    delete:
      tags: [tags]
      summary: Delete tag
      operationId: deleteTag
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

    post:
      tags: [projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request

  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [projects]
      summary: Get project
      operationId: getProject
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Not found

    patch:
      tags: [projects]
      summary: Update project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request
        '404':
          description: Not found

    delete:
      tags: [projects]
      summary: Delete project
      operationId: deleteProject
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /time-spans:
    get:
      tags: [timespans]
      summary: List time spans
      operationId: listTimeSpans
      responses:
        '200':
          description: List of time spans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSpan'

    post:
      tags: [timespans]
      summary: Create time span
      operationId: createTimeSpan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeSpan'
      responses:
        '201':
          description: Time span created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSpan'
        '400':
          description: Bad request

  /time-spans/{timeSpanId}:
    parameters:
      - name: timeSpanId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [timespans]
      summary: Get time span
      operationId: getTimeSpan
      responses:
        '200':
          description: Time span
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSpan'
        '404':
          description: Not found

    patch:
      tags: [timespans]
      summary: Update time span
      operationId: updateTimeSpan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimeSpan'
      responses:
        '200':
          description: Updated time span
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSpan'
        '400':
          description: Bad request
        '404':
          description: Not found

    delete:
      tags: [timespans]
      summary: Delete time span
      operationId: deleteTimeSpan
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

components:
#   securitySchemes:
#     oidc:
#       type: openIdConnect
#       openIdConnectUrl: https://example.com/.well-known/openid-configuration

  schemas:
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        color:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
    CreateTag:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
    UpdateTag:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
    Project:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        color:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
        timeBudgetHours:
          type: number
          format: double
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    CreateProject:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
        timeBudgetHours:
          type: number
          format: double
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    UpdateProject:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
        timeBudgetHours:
          type: number
          format: double
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    TimeSpan:
      type: object
      required: [id, name, startTime, endTime]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    CreateTimeSpan:
      type: object
      required: [name, startTime, endTime]
      properties:
        name:
          type: string
          minLength: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    UpdateTimeSpan:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
