app-passwords:
  get:
    tags: [app-passwords]
    summary: List app passwords
    operationId: listAppPasswords
    responses:
      '200':
        description: App passwords of the current scope, without their secrets
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/app-passwords.yaml#/AppPassword"
  post:
    tags: [app-passwords]
    summary: Create app password
    operationId: createAppPassword
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/app-passwords.yaml#/CreateAppPassword"
    responses:
      '201':
        description: App password created
        content:
          application/json:
            schema:
              $ref: "../schemas/app-passwords.yaml#/CreatedAppPassword"
      '400':
        description: Bad request

app-passwords-id:
  parameters:
    - $ref: "../parameters/app-passwords.yaml#/appPasswordIdPath"
  delete:
    tags: [app-passwords]
    summary: Delete app password
    operationId: deleteAppPassword
    security:
      - sessionCookie: []
    responses:
      '204':
        description: App password deleted
      '404':
        description: App password not found
