tags:
  get:
    tags: [tags]
    summary: List tags
    operationId: listTags
    parameters:
      - $ref: "../parameters/shared.yaml#/limit"
      - $ref: "../parameters/shared.yaml#/offset"
      - $ref: "../parameters/shared.yaml#/includeArchivedQuery"
    responses:
      '200':
        description: Paginated list of tags
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/PaginatedTags"
      '400':
        description: Bad request
  post:
    tags: [tags]
    summary: Create tag
    operationId: createTag
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tags.yaml#/CreateTag"
    responses:
      '201':
        description: Tag created
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/Tag"
      '400':
        description: Bad request

tags-id:
  parameters:
    - $ref: "../parameters/shared.yaml#/tagIdPath"
  get:
    tags: [tags]
    summary: Get tag
    operationId: getTag
    parameters:
      - $ref: "../parameters/shared.yaml#/includeQuery"
    responses:
      '200':
        description: Tag
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/Tag"
      '404':
        description: Not found
  patch:
    tags: [tags]
    summary: Update tag
    operationId: updateTag
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tags.yaml#/UpdateTag"
    responses:
      '200':
        description: Updated tag
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/Tag"
      '400':
        description: Bad request
      '404':
        description: Not found
  delete:
    tags: [tags]
    summary: Delete tag
    operationId: deleteTag
    security:
      - sessionCookie: []
    responses:
      '204':
        description: Deleted
      '404':
        description: Not found

tags-id-stats:
  get:
    operationId: getTagStats
    summary: Get timeseries stats for a tag
    tags: [tags]
    description: >
      Returns aggregated timeseries data for a given metric on a tag.
      Data is bucketed by the requested interval granularity within the
      specified time range. Defaults to `P30D/{now}` (the last 30 days)
      if `interval` is omitted.
    parameters:
      - $ref: "../parameters/shared.yaml#/tagIdPath"
      - $ref: "../parameters/shared.yaml#/statsMetric"
      - $ref: "../parameters/shared.yaml#/interval"
      - $ref: "../parameters/shared.yaml#/granularity"
      - $ref: "../parameters/shared.yaml#/timezone"
    responses:
      '200':
        description: Timeseries data for the requested metric.
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/TagStats"
            example:
              tag_id: "a8e6b57e-4863-4f53-abd5-edecea66382c"
              metric: time_spent
              interval: "2024-01-01T00:00:00Z/2024-03-31T23:59:59Z"
              granularity: P1W
              unit: seconds
              series:
                - interval: "2024-01-01T00:00:00Z/2024-01-08T00:00:00Z"
                  value: 18000
                - interval: "2024-01-08T00:00:00Z/2024-01-15T00:00:00Z"
                  value: 25200
      '400':
        description: Invalid query parameters.
      '404':
        description: Tag not found.
      '422':
        description: >
          Unprocessable request — e.g. `from` is after `to`, or the
          requested range exceeds the maximum allowed window.
