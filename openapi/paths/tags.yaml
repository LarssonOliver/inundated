tags:
  get:
    tags: [tags]
    summary: List tags
    operationId: listTags
    parameters:
      - $ref: "../parameters/shared.yaml#/limit"
      - $ref: "../parameters/shared.yaml#/offset"
    responses:
      '200':
        description: Paginated list of tags
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/PaginatedTags"
      '400':
        description: Bad request
  post:
    tags: [tags]
    summary: Create tag
    operationId: createTag
    parameters:
      - $ref: "../parameters/auth.yaml#/XRSFTokenHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tags.yaml#/CreateTag"
    responses:
      '201':
        description: Tag created
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/Tag"
      '400':
        description: Bad request

tags-id:
  parameters:
    - $ref: "../parameters/shared.yaml#/tagIdPath"
  get:
    tags: [tags]
    summary: Get tag
    operationId: getTag
    parameters:
      - $ref: "../parameters/shared.yaml#/includeQuery"
    responses:
      '200':
        description: Tag
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/Tag"
      '404':
        description: Not found
  patch:
    tags: [tags]
    summary: Update tag
    operationId: updateTag
    parameters:
      - $ref: "../parameters/auth.yaml#/XRSFTokenHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/tags.yaml#/UpdateTag"
    responses:
      '200':
        description: Updated tag
        content:
          application/json:
            schema:
              $ref: "../schemas/tags.yaml#/Tag"
      '400':
        description: Bad request
      '404':
        description: Not found
  delete:
    tags: [tags]
    summary: Delete tag
    operationId: deleteTag
    parameters:
      - $ref: "../parameters/auth.yaml#/XRSFTokenHeader"
    responses:
      '204':
        description: Deleted
      '404':
        description: Not found
