login:
  get:
    tags: [auth]
    summary: Initiate OIDC login
    operationId: authLogin
    security: [] # public
    description: >
      Starts the OpenID Connect authorization flow by redirecting the user
      to the configured identity provider.
    parameters:
      - $ref: "../parameters/shared.yaml#/redirect"
    responses:
      "200":
        description: >
          This endpoint initiates the login flow and typically redirects the user
          to the identity provider. A 200 response is not expected in normal browser usage.
      "302":
        description: Redirect to the identity provider.
        headers:
          Location:
            description: Authorization endpoint.
            required: true
            schema:
              $ref: "../schemas/shared.yaml#/Location"
          Set-Cookie:
            description: >
              HttpOnly browser-binding cookie echoed back by the callback to
              defeat login CSRF / session fixation.
            required: true
            schema:
              type: string
      "400":
        description: Bad request
callback:
  get:
    tags: [auth]
    summary: OIDC callback
    operationId: authCallback
    security: [] # public
    description: >
      Callback endpoint invoked by the identity provider after the user
      has authenticated. Exchanges the authorization code for tokens,
      establishes a session, and redirects the user back to the application.
    parameters:
      - $ref: "../parameters/auth.yaml#/code"
      - $ref: "../parameters/auth.yaml#/state"
      - $ref: "../parameters/auth.yaml#/loginBinding"
    responses:
      "200":
        description: >
          This endpoint is part of the login flow and typically redirects the user
          to the identity provider. A 200 response is not expected in normal browser usage.
      "302":
        description: Session established and user redirected.
        headers:
          Set-Cookie:
            description: Session cookie.
            required: true
            schema:
              type: string
          Location:
            description: Redirect target.
            required: true
            schema:
              $ref: "../schemas/shared.yaml#/Location"
      "400":
        description: Bad request
      "401":
        description: Unaurhotrized
logout:
  post:
    tags: [auth]
    summary: Log out
    operationId: authLogout
    security:
      - sessionCookie: []
        xsrfToken: []
    responses:
      "204":
        description: Session terminated
        headers:
          Set-Cookie:
            description: Clears the session cookie.
            required: true
            schema:
              type: string
      "302":
        description: Session terminated and browser redirected
      "401":
        description: Unaurhotrized
