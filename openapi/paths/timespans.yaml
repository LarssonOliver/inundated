timespans:
  get:
    tags: [timespans]
    summary: List time spans
    operationId: listTimespans
    description: >
      Returns a paginated list of time spans, most recent first. When
      `interval` is given, only time spans that overlap it are returned;
      omit it to list the full, unbounded history.
    parameters:
      - $ref: "../parameters/shared.yaml#/limit"
      - $ref: "../parameters/shared.yaml#/offset"
      - $ref: "../parameters/shared.yaml#/interval"
    responses:
      '200':
        description: Paginated list of time spans
        content:
          application/json:
            schema:
              $ref: "../schemas/timespans.yaml#/PaginatedTimespans"
      '400':
        description: Bad request
      '422':
        description: Unprocessable request — e.g. the interval's end is not after its start.
  post:
    tags: [timespans]
    summary: Create time span
    operationId: createTimespan
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/timespans.yaml#/CreateTimespan"
    responses:
      '201':
        description: Time span created
        content:
          application/json:
            schema:
              $ref: "../schemas/timespans.yaml#/Timespan"
      '400':
        description: Bad request

timespans-id:
  parameters:
    - $ref: "../parameters/shared.yaml#/timespanIdPath"
  get:
    tags: [timespans]
    summary: Get time span
    operationId: getTimespan
    responses:
      '200':
        description: Time span
        content:
          application/json:
            schema:
              $ref: "../schemas/timespans.yaml#/Timespan"
      '404':
        description: Not found
  patch:
    tags: [timespans]
    summary: Update time span
    operationId: updateTimespan
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/timespans.yaml#/UpdateTimespan"
    responses:
      '200':
        description: Updated time span
        content:
          application/json:
            schema:
              $ref: "../schemas/timespans.yaml#/Timespan"
      '400':
        description: Bad request
      '404':
        description: Not found
  delete:
    tags: [timespans]
    summary: Delete time span
    operationId: deleteTimespan
    security:
      - sessionCookie: []
    responses:
      '204':
        description: Deleted
      '404':
        description: Not found
