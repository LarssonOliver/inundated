AppPassword:
  type: object
  required: [id, name, createdAt]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    createdAt:
      type: string
      format: date-time
    lastUsedAt:
      type: string
      format: date-time
      description: When the app password last authenticated a request. Unset
        until it is first used.

CreatedAppPassword:
  description: A newly created app password. The password is only returned
    here and cannot be retrieved again.
  allOf:
    - $ref: "#/AppPassword"
    - type: object
      required: [password]
      properties:
        password:
          type: string

CreateAppPassword:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: A label for the client that will use the password.
