Project:
  type: object
  required: [id, name, color]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
    color:
      $ref: './shared.yaml#/HexColor'
    timeBudgetHours:
      type: number
      format: double
    tagIds:
      $ref: './shared.yaml#/TagIdList'
    totalTimeMs:
      type: integer

CreateProject:
  type: object
  required: [name, color]
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: './shared.yaml#/HexColor'
    timeBudgetHours:
      type: number
      format: double
    tagIds:
      $ref: './shared.yaml#/TagIdList'

UpdateProject:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: './shared.yaml#/HexColor'
    timeBudgetHours:
      type: number
      format: double
    tagIds:
      $ref: './shared.yaml#/TagIdList'
