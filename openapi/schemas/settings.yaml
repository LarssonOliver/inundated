Settings:
  type: object
  required: [weekStartDay, timezone, durationFormat, timeFormat]
  properties:
    weekStartDay:
      $ref: "#/WeekStartDay"
    timezone:
      type: string
      description: IANA timezone name, e.g. "Europe/Stockholm" or "UTC".
    durationFormat:
      $ref: "#/DurationFormat"
    timeFormat:
      $ref: "#/TimeFormat"

UpdateSettings:
  type: object
  minProperties: 1
  properties:
    weekStartDay:
      $ref: "#/WeekStartDay"
    timezone:
      type: string
    durationFormat:
      $ref: "#/DurationFormat"
    timeFormat:
      $ref: "#/TimeFormat"

WeekStartDay:
  type: string
  enum: [monday, sunday]
  description: The first day of the week for calendar/report views.

DurationFormat:
  type: string
  enum: [long, decimal, clock]
  description: >
    How durations are rendered in the UI: "long" (e.g. "2h 30m"), "decimal"
    (e.g. "2.5h"), or "clock" (e.g. "02:30").

TimeFormat:
  type: string
  enum: ["12h", "24h"]
  description: Whether clock times are shown 12-hour (with AM/PM) or 24-hour.
