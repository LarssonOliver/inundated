# Shared schema fragments — not standalone schemas, just anchors for reuse.

HexColor:
  type: string
  pattern: "^#(?:[0-9a-fA-F]{3}){1,2}$"

TagIdList:
  type: array
  uniqueItems: true
  items:
    type: string
    format: uuid

SeriesPoint:
  type: object
  required:
    - interval
    - value
  properties:
    interval:
      type: string
      description: >
        The time bucket for this data point as an ISO 8601 interval in
        `{start}/{end}` form (e.g. `2024-01-01T00:00:00Z/2024-01-08T00:00:00Z`).
      example: "2024-01-01T00:00:00Z/2024-01-08T00:00:00Z"
    value:
      type: number
      description: The aggregated metric value for this bucket.
      minimum: 0

ErrorResponse:
  type: object
  required:
    - error
    - message
  properties:
    error:
      type: string
      description: A stable machine-readable error code.
      example: invalid_parameter
    message:
      type: string
      description: A human-readable explanation of the error.
      example: "`from` must be before `to`"

PaginationDetails:
  type: object
  properties:
    limit:
      type: integer
      description: Items per page
    offset:
      type: integer
      description: Number of items skipped
    total:
      type: integer
      description: Total number of items available
  required: 
  - limit
  - offset
  - total
  description: Pagination metadata

Location:
  type: string
  format: uri
