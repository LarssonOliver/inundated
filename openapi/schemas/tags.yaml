Tag:
  type: object
  required: [id, name, color]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
    color:
      $ref: './shared.yaml#/HexColor'
    totalTimeMs:
      type: integer

CreateTag:
  type: object
  required: [name, color]
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: './shared.yaml#/HexColor'

UpdateTag:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: './shared.yaml#/HexColor'
