Tag:
  type: object
  required: [id, name, color]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"
    totalTimeMs:
      type: integer

CreateTag:
  type: object
  required: [name, color]
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"

UpdateTag:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"

TagStats:
  type: object
  required:
    - tag_id
    - metric
    - interval
    - granularity
    - unit
    - series
  properties:
    tag_id:
      type: string
      format: uuid
      description: The ID of the tag this data belongs to.
    metric:
      $ref: "./shared.yaml#/StatsMetric"
    interval:
      type: string
      description: >
        The effective time range of the response as an ISO 8601 interval,
        always resolved to `{start}/{end}` form regardless of how the request
        was expressed.
      example: "2024-01-01T00:00:00Z/2024-03-31T23:59:59Z"
    granularity:
      type: string
      description: The ISO 8601 duration used to bucket each series point.
      example: P1W
    unit:
      type: string
      description: >
        The unit of the `value` field in each series point.
        Allows clients to label axes correctly without hardcoding.
      example: seconds
    series:
      type: array
      description: Ordered list of aggregated data points.
      items:
        $ref: "./shared.yaml#/SeriesPoint"

PaginatedTags:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "#/Tag"
      description: Array of items in this page
    pagination:
      $ref: "./shared.yaml#/PaginationDetails"
  required: [data, pagination]
