Tag:
  type: object
  required: [id, name, color]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"
    totalTimeMs:
      type: integer

CreateTag:
  type: object
  required: [name, color]
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"

UpdateTag:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"

PaginatedTags:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "#/Tag"
      description: Array of items in this page
    pagination:
      $ref: "./shared.yaml#/PaginationDetails"
  required: [data, pagination]
