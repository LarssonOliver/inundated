Tag:
  type: object
  required: [id, name, color]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"
    totalTimeMs:
      type: integer

CreateTag:
  type: object
  required: [name, color]
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"

UpdateTag:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    color:
      $ref: "./shared.yaml#/HexColor"

PaginatedTags:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "#/Tag"
      description: Array of items in this page
    pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Items per page
        offset:
          type: integer
          description: Number of items skipped
        total:
          type: integer
          description: Total number of items available
      required: [limit, offset, total]
      description: Pagination metadata
  required: [data, pagination]
