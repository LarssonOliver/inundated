when:
  - event: pull_request
  - event: push
    branch: main

depends_on:
  - ci-api

services:
  - name: kubedock
    image: ghcr.io/joyrex2001/kubedock:0.20.3
    commands:
      - /usr/local/bin/kubedock server --disable-dind --reverse-proxy --node-selector=kubernetes.io/arch=amd64
    backend_options: &backops
      kubernetes:
        serviceAccountName: kubedock
        tolerations:
          - key: amd64
            value: "true"
            effect: PreferNoSchedule
        nodeSelector:
          kubernetes.io/arch: amd64

steps:
  - name: test
    image: golang:1.25.5-alpine
    commands:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
    environment:
      DOCKER_HOST: tcp://kubedock:2475
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_CHECKS_DISABLE: "true"
    when:
      - path:
          exclude: 
            - frontend/**
    backend_options: *backops
